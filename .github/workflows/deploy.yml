name: Deploy Frontend

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Due ambienti di produzione sullo stesso host, stesso branch master:
    #   prod  → app.nonprofitgest.it      (porta 6173, ~/management-software-prod)
    #   prod2 → app.gestionalenonprofit.it (porta 7173, ~/management-software-prod2)
    # Ognuno si aggancia alla rete del proprio backend (backend_prod / backend_prod2).
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - env_name: prod
            path_secret: DEPLOY_PATH_PROD
            project: frontend_prod
            app_network: backend_prod_app_network
            container_name: assoc_frontend_prod
            port: "6173"
          - env_name: prod2
            path_secret: DEPLOY_PATH_PROD2
            project: frontend_prod2
            app_network: backend_prod2_app_network
            container_name: assoc_frontend_prod2
            port: "7173"
    name: deploy (${{ matrix.env_name }})
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          # Margine per l'attesa del lock (deploy di altri ambienti/repo in corso).
          command_timeout: 45m
          script: |
            set -e
            # Un solo deploy alla volta sull'host (dev, prod, prod2, backend e frontend
            # condividono lo stesso Docker daemon su una macchina da 4 GB): build
            # concorrenti mandano il daemon in timeout e lasciano container a meta'.
            exec 9>/tmp/assoc-deploy.lock
            echo "In attesa del lock di deploy..."
            flock 9
            # Timeout delle chiamate di docker-compose al daemon (default 60s).
            export COMPOSE_HTTP_TIMEOUT=300
            DEPLOY_DIR="${{ secrets[matrix.path_secret] }}"
            # Ambiente non ancora inizializzato sull'host (secret mancante o checkout
            # assente): si salta senza far fallire il deploy degli altri ambienti.
            if [ -z "$DEPLOY_DIR" ] || [ ! -d "$DEPLOY_DIR/.git" ]; then
              echo "::warning::Ambiente ${{ matrix.env_name }} non inizializzato ($DEPLOY_DIR): deploy saltato."
              exit 0
            fi
            cd "$DEPLOY_DIR"

            # Builder classico: le immagini includono "ContainerConfig", evitando il
            # bug di docker-compose v1 "KeyError: 'ContainerConfig'" alla ricreazione.
            export DOCKER_BUILDKIT=0
            export COMPOSE_DOCKER_CLI_BUILD=0
            # Progetto compose isolato per ambiente, distinto da dev (frontend) e dai backend.
            export COMPOSE_PROJECT_NAME=${{ matrix.project }}
            # Rete del gateway API creata dal compose backend dell'ambiente
            # (<COMPOSE_PROJECT_NAME del backend>_app_network).
            export APP_NETWORK=${{ matrix.app_network }}
            # Nome container e porta host distinti per ambiente (stesso docker-compose.yml
            # usato da dev e dalle prod sullo stesso host).
            export FRONTEND_CONTAINER_NAME=${{ matrix.container_name }}
            export FRONTEND_PORT=${{ matrix.port }}
            echo "Ambiente: ${{ matrix.env_name }}"
            echo "Rete API condivisa: $APP_NETWORK"

            git pull origin master

            cd docker
            # Build + ricreazione robusta (rm prima di up: evita l'ereditarieta' dei
            # volumi dal vecchio container, causa del bug ContainerConfig).
            docker-compose build
            docker-compose rm -sf || true
            docker-compose up -d
            echo "Frontend deploy completed."
