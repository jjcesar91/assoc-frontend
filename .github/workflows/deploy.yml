name: Deploy Frontend

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH_PROD }}

            # Builder classico: le immagini includono "ContainerConfig", evitando il
            # bug di docker-compose v1 "KeyError: 'ContainerConfig'" alla ricreazione.
            export DOCKER_BUILDKIT=0
            export COMPOSE_DOCKER_CLI_BUILD=0
            # Progetto compose isolato, distinto da dev (frontend) e dal backend prod.
            export COMPOSE_PROJECT_NAME=frontend_prod
            # Rete del gateway API creata dal compose backend_prod (COMPOSE_PROJECT_NAME
            # li' e' backend_prod, quindi la rete si chiama backend_prod_app_network).
            export APP_NETWORK=backend_prod_app_network
            echo "Rete API condivisa: $APP_NETWORK"

            git pull origin master

            cd docker
            # Build + ricreazione robusta (rm prima di up: evita l'ereditarieta' dei
            # volumi dal vecchio container, causa del bug ContainerConfig).
            docker-compose build
            docker-compose rm -sf || true
            docker-compose up -d
            echo "Frontend deploy completed."
