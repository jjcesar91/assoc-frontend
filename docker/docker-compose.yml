version: '3.8'

# Project name dedicato e distinto dal backend: evita sia le collisioni con altri
# stack (es. revisionilegali) sia i falsi "orphan containers" del backend, che
# vive in un compose separato ma si aggancia alla stessa rete assoc_app_network.
# NB: NON impostare qui una chiave top-level `name:` — docker-compose v1 (usato
# in produzione) valida col vecchio schema e la rifiuta. Il nome progetto e'
# gia' iniettato dallo script di deploy via COMPOSE_PROJECT_NAME=frontend.

# Compose dedicato al frontend (Vite dev server).
# Vive nel repo assoc-frontend ed e' avviato dalla sua GitHub Action ad ogni push.
# Si collega alla rete del gateway API (creata dal compose del backend) per
# raggiungere il servizio "nginx" tramite VITE_API_TARGET=http://nginx.
services:
  frontend:
    build: ..
    container_name: assoc_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_TARGET=http://nginx
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ..:/app
      - /app/node_modules
    networks:
      - app_network

networks:
  # Rete condivisa con il backend (gateway nginx + microservizi).
  # Il nome reale e' iniettato dall'Action via ${APP_NETWORK} (default docker_app_network).
  app_network:
    external:
      name: ${APP_NETWORK:-assoc_app_network}
